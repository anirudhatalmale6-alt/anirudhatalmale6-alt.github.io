<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#FBF5EC" />
    <title>EILPS is offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#FBF5EC;color:#251D14;font:17px/1.6 Arial,sans-serif}
      main{width:min(100%,560px);display:grid;gap:15px}.mark{width:54px;height:54px;display:grid;place-items:center;border-radius:8px;background:#FF7A4D;color:#fff;font-size:24px;font-weight:800}
      h1,p{margin:0}p{color:#6F6252}a{justify-self:start;border-radius:7px;padding:11px 14px;background:#10B5A0;color:#fff;font-weight:800;text-decoration:none}
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">E</span>
      <h1>You are offline</h1>
      <p>Reconnect to open lessons, save progress, join a class, or use live tutoring. EILPS will keep this screen available while the connection returns.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
